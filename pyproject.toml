[project]
name = "torch-lattice"
version = "0.1.0"
description = "Lattice QCD kernels and HMC in JAX and PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "defusedxml==0.7.1",
  "jax==0.10.2",
  "jaxlib==0.10.2",
  "matplotlib==3.11.2",
  "numpy==2.4.6",
  "torch==2.14.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
